<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ywGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#ywGrad)" />

  <!-- Stylized Geometric "Y" & "W" Path -->
  <!-- Upper Left Branch of Y -->
  <path d="M 28 28 L 50 50 L 50 72" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Upper Right Branch of Y transitioning into W -->
  <path d="M 72 28 L 50 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  
  <!-- Overlapping dynamic forward learning path arrow representing "Your Way" -->
  <path d="M 38 68 L 50 54 L 62 68 L 74 54" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Guiding Compass Star / Student Milestone Dot -->
  <circle cx="50" cy="22" r="5.5" fill="#f59e0b" />
</svg>
